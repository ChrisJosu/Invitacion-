<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación Arácnida 🕷️</title>
    <style>
        body {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            
            /* --- CAMBIO AQUÍ: Fondo con imagen oscurecida --- */
            background-image: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('fondo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            font-family: 'Arial', sans-serif;
            color: white;
            text-align: center;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* --- CAMBIO AQUÍ: Estilo para las estrellas brillantes --- */
        .estrella {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            z-index: 0; /* Para que queden detrás de los botones y textos */
            animation: parpadeo infinite alternate ease-in-out;
        }

        @keyframes parpadeo {
            0% { opacity: 0.1; box-shadow: 0 0 2px rgba(255, 255, 255, 0.1); transform: scale(0.8); }
            100% { opacity: 1; box-shadow: 0 0 8px rgba(255, 255, 255, 0.9); transform: scale(1.2); }
        }

        h1 {
            margin: 8vh 20px 0;
            font-size: 2.5rem;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            padding: 0 20px;
            z-index: 2;
            max-width: 90%;
        }

        .buttons-container {
            display: flex;
            gap: 20px;
            margin-top: auto;
            margin-bottom: auto;
            z-index: 2;
        }

        button {
            font-size: 1.5rem;
            padding: 15px 40px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s ease, font-size 0.2s ease;
        }

        #btn-yes {
            background-color: #28a745;
            color: white;
        }

        #btn-no {
            background-color: #dc3545;
            color: white;
            position: relative;
            max-width: 260px;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.2);
            z-index: 1;
            pointer-events: none; /* Permite hacer clic a través del overlay */
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <h1 id="pregunta">¿Sisa, quieres ir a ver Spider-Man conmigo? </h1>

    <div class="buttons-container">
        <button id="btn-yes">¡Sí!</button>
        <button id="btn-no">No</button>
    </div>

    <!--  
      MÚSICA DE FONDO:
      Coloca tu archivo de audio (por ejemplo "musica.mp3") en la misma carpeta 
      que este HTML, o cambia el "src" de abajo por un enlace directo a un archivo de audio.
      La página intenta reproducir la música apenas carga. Si el navegador la bloquea,
      arranca automáticamente con el primer clic, toque o tecla en cualquier parte de la pantalla.
    -->
    <audio id="musica-fondo" loop>
        <source src="Gone, Gone, Gone - Phillip Phillips (Español)  Peter & Gwen.mp3" type="audio/mpeg">
    </audio>

    <script>
        // --- CAMBIO AQUÍ: Función para crear el fondo estrellado ---
        function crearEstrellas() {
            const cantidadEstrellas = 100;
            for (let i = 0; i < cantidadEstrellas; i++) {
                const estrella = document.createElement('div');
                estrella.classList.add('estrella');
                
                // Tamaño aleatorio entre 1px y 3px
                const size = Math.random() * 2 + 1;
                estrella.style.width = `${size}px`;
                estrella.style.height = `${size}px`;
                
                // Posición aleatoria en toda la pantalla
                estrella.style.left = `${Math.random() * 100}vw`;
                estrella.style.top = `${Math.random() * 100}vh`;
                
                // Animación desfasada para que no brillen al mismo tiempo
                estrella.style.animationDuration = `${Math.random() * 2 + 1.5}s`;
                estrella.style.animationDelay = `${Math.random() * 3}s`;
                
                document.body.appendChild(estrella);
            }
        }
        crearEstrellas();
        // -----------------------------------------------------------

        const btnNo = document.getElementById('btn-no');
        const btnYes = document.getElementById('btn-yes');
        const pregunta = document.getElementById('pregunta');
        const musica = document.getElementById('musica-fondo');
        let yesScale = 1;
        let musicaIniciada = false;

        // Mensajes que van apareciendo arriba mientras el botón "No" se escapa
        const mensajes = [
            "¿Sisa, quieres ir a ver Spider-Man conmigo? ",
            "Vamos, di que sí ",
            "Porfa porfa porfa ",
            "¿En serio vas a decir que no?, andale sisa di que si ",
            "vamosss cofa di que si  ",
            "Porfa acepta ",
            "No seas mala, di que sí ",
            "Vamos di que shi 🥺 ",
            "¡Sí, sí, sí! Eso es lo que quieres decir ",
            "Ya ríndete y dile que sí ",
            "YA DIME QUE SI, MI SISA PORFA"
        ];
        let mensajeIndex = 0;

        function iniciarMusica() {
            if (!musicaIniciada) {
                const intento = musica.play();
                if (intento !== undefined) {
                    intento.then(() => {
                        musicaIniciada = true;
                    }).catch(() => {});
                }
            }
        }

        // Intenta reproducir la música apenas carga la página
        iniciarMusica();

        // Si el navegador bloquea el autoplay, arranca con el primer toque/clic/tecla en cualquier parte de la pantalla
        ['click', 'touchstart', 'keydown'].forEach(evento => {
            document.addEventListener(evento, iniciarMusica);
        });

        function esquivarBoton() {
            iniciarMusica();

            btnNo.style.position = 'fixed';

            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;

            const buttonWidth = btnNo.offsetWidth;
            const buttonHeight = btnNo.offsetHeight;

            const randomX = Math.floor(Math.random() * (windowWidth - buttonWidth));
            const randomY = Math.floor(Math.random() * (windowHeight - buttonHeight));

            btnNo.style.left = `${randomX}px`;
            btnNo.style.top = `${randomY}px`;

            yesScale += 0.2;
            btnYes.style.transform = `scale(${yesScale})`;

            // Cambia el texto de arriba (la pregunta) cada vez, ciclando por la lista
            mensajeIndex = (mensajeIndex + 1) % mensajes.length;
            pregunta.textContent = mensajes[mensajeIndex];
        }

        btnNo.addEventListener('mouseover', esquivarBoton);
        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault();
            esquivarBoton();
        });

        btnYes.addEventListener('click', () => {
            iniciarMusica();
            
            document.querySelector('.buttons-container').style.display = 'none';
            
            pregunta.style.marginTop = '20px';
            pregunta.innerHTML = `
                <span style="font-size: 2.5rem; display: block; margin-bottom: 20px;">Gracias por aceptar, Sisa 🤎</span>
                
                <div style="display: flex; flex-direction: column; gap: 15px; font-size: 1.2rem; font-weight: normal; line-height: 1.4; align-items: center;">
                    <div style="background-color: rgba(0, 0, 0, 0.4); padding: 15px 25px; border-radius: 12px; max-width: 800px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 2;">
                        Quiero en verdad ir a ver esa pelicula contigo, cumplir el 1er plan que tuvimos, me haces muy feliz, para organizar todo me puedes mandar un mensaje al WTS y si te preocupa el permiso, yo le dire a tu ma, solo quiero ir a verla contigo <br><br>
                        y como dijo peter una vez:
                    </div>
                    
                    <div style="background-color: rgba(0, 0, 0, 0.4); padding: 15px 25px; border-radius: 12px; max-width: 800px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); font-style: italic; z-index: 2;">
                        NO SE NADA NO SE NADA, LA UNICA COSA QUE PUEDO TENER CLARA ES QUE TE AMO, Y NO TE OFENDAS PERO TE EQUIVOCAS, DE QUE ESTAMOS EN CAMINOS SEPARADOS, NO SON CAMINOS SEPARADOS, TU ERES MI CAMINO
                    </div>
                    
                    <div style="background-color: rgba(0, 0, 0, 0.4); padding: 15px 25px; border-radius: 12px; max-width: 800px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); font-weight: bold; z-index: 2;">
                        -TE AMO MUCHOTE MI SISA 🤎
                    </div>
                </div>
            `;

            const imagen = document.createElement('img');
            imagen.src = 'SP.png';
            imagen.style.zIndex = '2';
            imagen.style.marginTop = '20px';
            imagen.style.maxWidth = '90%';
            imagen.style.maxHeight = '35vh'; 
            imagen.style.borderRadius = '15px';
            imagen.style.boxShadow = '0 5px 15px rgba(0,0,0,0.5)';
            document.body.appendChild(imagen);
        
        });
    </script>
</body>
</html>
